<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Under Maintenance | Ankush Chowrasia</title>
    <meta name="description" content="Ankush Chowrasia's portfolio is currently under maintenance. Please contact via LinkedIn.">

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { gold: '#C9A227', dark: '#0A0A0A' }
                    },
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        heading: ['Playfair Display', 'serif'] 
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0A0A0A;
            /* Ensures no scrollbars if content is small */
            overflow: hidden; 
        }

        /* Elegant card container glow */
        .maintenance-card {
            border: 1px solid rgba(201, 162, 39, 0.3);
            box-shadow: 
                0 0 30px rgba(201, 162, 39, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            animation: cardGlowPulse 4s ease-in-out infinite;
        }

        @keyframes cardGlowPulse {
            0%, 100% {
                box-shadow: 
                    0 0 30px rgba(201, 162, 39, 0.1),
                    inset 0 1px 0 rgba(255, 255, 255, 0.05);
                border-color: rgba(201, 162, 39, 0.3);
            }
            50% {
                box-shadow: 
                    0 0 50px rgba(201, 162, 39, 0.2),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
                border-color: rgba(201, 162, 39, 0.6);
            }
        }

        /* Subtle pulsing gear icon */
        .spin-slow {
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="text-white font-sans min-h-screen flex items-center justify-center p-4 relative">

    <!-- Decorative Background Glow -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[20rem] md:w-[40rem] h-[20rem] md:h-[40rem] bg-brand-gold/10 rounded-full blur-[100px] md:blur-[150px] pointer-events-none -z-10"></div>

    <!-- Main Content Container -->
    <main class="maintenance-card bg-[#0d1117]/80 backdrop-blur-xl p-10 md:p-16 rounded-3xl text-center max-w-2xl w-full flex flex-col items-center relative z-10 transform transition-all hover:scale-[1.02] duration-500">
        
        <!-- Icon -->
        <div class="w-20 h-20 bg-brand-gold/10 border border-brand-gold/40 rounded-2xl flex items-center justify-center text-brand-gold text-4xl mb-8 shadow-[0_0_20px_rgba(201,162,39,0.2)]">
            <i class="fas fa-cog spin-slow"></i>
        </div>

        <!-- Headings -->
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold text-brand-gold font-heading mb-6 tracking-tight">
            Page under maintenance..
        </h1>
        
        <p class="text-gray-400 text-lg md:text-xl mb-12 max-w-md font-light">
            Contact on LinkedIn only.
        </p>

        <!-- Action Button -->
        <a href="https://www.linkedin.com/in/ankushchowrasia27/" target="_blank" rel="noopener noreferrer" 
           class="group bg-brand-gold text-[#0A0A0A] px-8 py-4 rounded-xl font-bold flex items-center gap-3 hover:bg-white transition-all duration-300 shadow-[0_0_20px_rgba(201,162,39,0.3)] hover:shadow-[0_0_35px_rgba(201,162,39,0.6)] text-lg">
            <i class="fab fa-linkedin text-2xl group-hover:scale-110 transition-transform duration-300"></i> 
            <span>LinkedIn Profile</span>
        </a>

    </main>

</body>

</html>
